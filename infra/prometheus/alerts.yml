groups:
  - name: shopapi
    rules:
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket[1m]))) > 1
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "p95 latency above 1s on {{ $labels.route }}"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[1m]))
            / sum(rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "More than 5% of requests are failing with 5xx"

      - alert: MemoryGrowth
        expr: process_resident_memory_bytes{job="shopapi"} > 300e6
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "ShopAPI resident memory above 300 MB"

      - alert: HighCpu
        # Single event-loop process: it stalls well before 1 core, so alert early.
        expr: rate(process_cpu_seconds_total{job="shopapi"}[1m]) > 0.5
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "ShopAPI CPU usage above 50% of one core"
