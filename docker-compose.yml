services:
  shopapi:
    build: ./shopapi
    ports: ["8000:8000"]
    environment:
      APP_VERSION: ${APP_VERSION:-v1.0.0}
    volumes:
      - ./logs:/logs
    restart: unless-stopped

  loadgen:
    build: ./loadgen
    environment:
      TARGET: http://shopapi:8000
      RPS: ${RPS:-5}
    depends_on: [shopapi]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    depends_on: [shopapi]
    restart: unless-stopped

volumes:
  prometheus-data:
