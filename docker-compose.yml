services:
  shopapi:
    build: ./shopapi
    ports: ["8000:8000"]
    environment:
      APP_VERSION: ${APP_VERSION:-v1.0.0}
    volumes:
      - ./logs:/logs
    restart: unless-stopped

  loadgen:
    build: ./loadgen
    environment:
      TARGET: http://shopapi:8000
      RPS: ${RPS:-5}
    depends_on: [shopapi]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    depends_on: [shopapi, alertmanager]
    restart: unless-stopped

  # Groups firing alerts and calls GenBot's responder (on the host) to investigate them.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports: ["9093:9093"]
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    extra_hosts:
      - host.docker.internal:host-gateway  # Docker Desktop provides this; Linux needs the mapping
    restart: unless-stopped

  # Vector DB as a server: the ingester writes and the agent reads at the same time,
  # which Chroma's embedded on-disk mode does not support across processes.
  chroma:
    image: chromadb/chroma:1.5.9
    ports: ["8001:8000"]
    volumes:
      - chroma-data:/data
    restart: unless-stopped

volumes:
  prometheus-data:
  chroma-data:
