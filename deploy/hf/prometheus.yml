# Single-container version of infra/prometheus/prometheus.yml: everything is on localhost.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /home/user/app/infra/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: shopapi
    static_configs:
      - targets: ["127.0.0.1:8000"]
