; Every GenBot process in one container. Logs go to stdout so they appear in the Space's log view.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:chroma]
command=chroma run --path /home/user/data/chroma --host 127.0.0.1 --port 8001
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:shopapi]
directory=/home/user/app/shopapi
command=/home/user/shopapi-venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log
environment=APP_VERSION="v1.0.0"
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:alertmanager]
command=alertmanager --config.file=/home/user/app/deploy/alertmanager.yml --storage.path=/home/user/data/alertmanager --web.listen-address=127.0.0.1:9093 --cluster.listen-address=
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:prometheus]
command=prometheus --config.file=/home/user/app/deploy/prometheus.yml --storage.tsdb.path=/home/user/data/prometheus --storage.tsdb.retention.time=2d --web.listen-address=127.0.0.1:9090
priority=20
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:loadgen]
directory=/home/user/app
command=python loadgen/loadgen.py
; Gentler traffic than the local stack: the free Space has 2 vCPUs.
environment=TARGET="http://127.0.0.1:8000",RPS="3"
priority=30
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:ingest]
directory=/home/user/app
command=python -m copilot.ingest
priority=30
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:responder]
directory=/home/user/app
command=python -m copilot.responder
priority=30
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:fault_ttl]
directory=/home/user/app
command=python scripts/fault_ttl.py --ttl 600
priority=30
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:ui]
directory=/home/user/app
command=python -m streamlit run copilot/ui.py --server.port 7860 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
priority=40
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
